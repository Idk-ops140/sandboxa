<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elenchos - Play</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <h1>Elenchos Sandbox</h1>
    <canvas id="sandboxCanvas"></canvas>
    <div id="tools">
      <button onclick="selectElement('water')">Water</button>
      <button onclick="selectElement('fire')">Fire</button>
      <button onclick="selectElement('sand')">Sand</button>
      <button onclick="selectElement('acid')">Acid</button>
      <button onclick="selectElement('soap')">Soap</button>
      <button onclick="selectElement('virus')">Virus</button>
    </div>
    <button onclick="goHome()">Home</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
